name: verify-ci-rollout

# Runs on the fix pull request itself as well as after it lands on main. Two
# independent facts are proven here so a submission cannot borrow evidence from
# another commit:
#
#   * criterion 2 — the ci run on the commit being submitted (this pull
#     request's head) completed successfully with every job;
#   * criterion 3 — the fix pull request #65 is mergeable into main with no
#     conflicts (the tracker performs the merge only after acceptance).
#
# The old version only ran for pull request #65, so a re-submission in a new
# pull request carried no check that either criterion held for its own head.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: verify-ci-rollout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fix-pr:
    name: verify-ci-rollout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pin the verified commit to the submitted head only when the event is a
      # run for PR #65 itself. For any other pull request (for example the
      # re-submission) leave it empty so the gate checks the current head of
      # PR #65 instead of treating the submitted head as PR #65's head. For a
      # push to main it also stays empty, so the merge commit is verified.
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 65 && github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CI passed on the real PR #65 head (or it is merged)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          target_args=()
          if [ -n "$TARGET_SHA" ]; then
            target_args=(--sha "$TARGET_SHA")
          fi
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA} target=${TARGET_SHA:-auto}" \
            >>"$GITHUB_STEP_SUMMARY"
          attempt=1
          until node scripts/ci/verify-rollout.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr 65 \
            "${target_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"; do
            if [ "$attempt" -ge 60 ]; then
              echo "rollout verification stayed red after ${attempt} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
      - name: Verify PR #65 is mergeable without conflicts (criterion 3)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          attempt=1
          until node scripts/ci/verify-mergeable.mjs \
            --repo "$GITHUB_REPOSITORY" --pr 65 \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"; do
            if [ "$attempt" -ge 30 ]; then
              echo "PR #65 stayed unmergeable after ${attempt} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
      - name: Publish verified rollout evidence on PR #65
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_args=()
          if [ -n "$TARGET_SHA" ]; then
            target_args=(--sha "$TARGET_SHA")
          fi
          node scripts/ci/publish-rollout-evidence.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr 65 \
            "${target_args[@]}" \
            --marker '<!-- testeb-63-rollout -->' \
            | tee "$RUNNER_TEMP/rollout-evidence.md"
      - name: Upload the verified rollout evidence
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@v4
        with:
          name: rollout-evidence
          path: ${{ runner.temp }}/rollout-evidence.md
          if-no-files-found: error

  verify-submitted-ci:
    name: verify-submitted-ci
    # For the re-submission in a new pull request, prove that ci ran successfully
    # on exactly that submitted head. PR #65 itself is covered by the job above.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number != 65 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBMITTED_PR: ${{ github.event.pull_request.number }}
      SUBMITTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CI on the submitted commit (criterion 2)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "submitted pr=#${SUBMITTED_PR} sha=${SUBMITTED_SHA}" >>"$GITHUB_STEP_SUMMARY"
          attempt=1
          until node scripts/ci/verify-rollout.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$SUBMITTED_PR" \
            --sha "$SUBMITTED_SHA" \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"; do
            if [ "$attempt" -ge 60 ]; then
              echo "submitted commit stayed without a green ci run after ${attempt} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
      - name: Verify the fix pull request #65 is mergeable (criterion 3)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          attempt=1
          until node scripts/ci/verify-mergeable.mjs \
            --repo "$GITHUB_REPOSITORY" --pr 65 \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"; do
            if [ "$attempt" -ge 30 ]; then
              echo "PR #65 stayed unmergeable after ${attempt} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
