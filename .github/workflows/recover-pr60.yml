name: "Recover PR #60 checks"
run-name: "Recover PR #60 checks from ${{ github.sha }}"

# The pull request #60 head predates any workflow file, so GitHub never created
# a run for it and will not do so retroactively. This workflow runs the regular
# checks against the pull request's *current* head (which may have moved since
# the incident), publishes the results as check runs/status on that exact
# commit, and completes the deferred merge when it is still open.
#
# The SHA from the incident report is only used for auditing. Pinning recovery to
# it would skip the merge whenever the head moved, which is exactly what must not
# happen.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: recover-pr-60
  cancel-in-progress: false

env:
  TARGET_PR: '60'
  INCIDENT_SHA: 'b1b0871d6ebb4f7ce25a987c956c7b1431eef379'
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  recover:
    name: Recover PR #60 checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out CI tooling
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false

      - name: Resolve the current pull request head
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tooling/scripts/ci/resolve-pr-target.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$TARGET_PR" \
            --expected-sha "$INCIDENT_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out resolved head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record checked commit
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          DRIFTED: ${{ steps.target.outputs.drifted }}
        run: |
          set -euo pipefail
          checked="$(git -C target rev-parse HEAD)"
          test "$checked" = "$TARGET_SHA"
          {
            echo "Checked commit: $checked"
            echo "Head branch: $HEAD_REF"
            echo "Incident commit: $INCIDENT_SHA"
            echo "Incident commit drifted: $DRIFTED"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Run repository checks against resolved head
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          bash tooling/scripts/ci/run-checks.sh target "$RUNNER_TEMP/checks.json" || true
          cat "$RUNNER_TEMP/checks.json"

      - name: Publish checks and complete deferred merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          node tooling/scripts/ci/recover-pr.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$TARGET_PR" \
            --sha "$TARGET_SHA" \
            --results "$RUNNER_TEMP/checks.json" \
            --details-url "$CI_RUN_URL" \
            --summary "Recovered checks for PR #${TARGET_PR} at ${TARGET_SHA}"

      # The push-triggered Finalize PR #60 evidence workflow is the reliable
      # path: both workflows run from the same push and the finalizer discovers
      # this run by its trigger SHA. The dispatch below is an extra kick for
      # manual recovery; it is allowed to fail because workflow_dispatch is
      # rejected until the finalizer exists on the default branch. The evidence
      # is never published from this in-progress run.
      - name: Request completed evidence finalization
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          FINALIZER_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node tooling/scripts/ci/request-evidence-finalize.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$FINALIZER_REF" \
            --pr "$TARGET_PR" \
            --sha "$TARGET_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow .github/workflows/finalize-pr60-evidence.yml
