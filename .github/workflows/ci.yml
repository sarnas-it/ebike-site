name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel superseded runs: a cancelled job can leave a stale
  # in_progress check run that keeps the pull request blocked after the newer
  # run has already finished green.
  cancel-in-progress: false

jobs:
  php-lint:
    name: php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  php-tests:
    name: php-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Run theme tests
        run: |
          set -e
          for test in wp/themes/velotok/tests/*-test.php; do
            echo "== ${test}"
            php "${test}"
          done

  php-plugin-tests:
    name: php-plugin-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Run accounts acceptance test
        run: php wp/plugins/velotok-core/tests/accounts-contract-test.php
      - name: Run plugin PHP contract tests
        run: |
          set -e
          for test in wp/plugins/velotok-core/tests/*-test.php; do
            echo "== ${test}"
            php "${test}"
          done

  plugin-tests:
    name: plugin-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run plugin contract tests
        run: |
          set -e
          for test in wp/plugins/velotok-core/tests/*.test.js; do
            echo "== ${test}"
            node "${test}"
          done

  ci-repair-tests:
    name: ci-repair-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test CI repair tooling
        run: |
          set -e
          for test in scripts/ci/tests/*.test.mjs; do
            echo "== ${test}"
            node "${test}"
          done
