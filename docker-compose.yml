name: velotok

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-velotok-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: ./wp/docker/wordpress
    image: velotok-wordpress:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress_data:/var/www/html
      - ./wp/plugins/velotok-core:/var/www/html/wp-content/plugins/velotok-core:ro
      - ./wp/themes/velotok:/var/www/html/wp-content/themes/velotok:ro
      - ./wp/themes/velotok-bold:/var/www/html/wp-content/themes/velotok-bold:ro
      - ./wp/themes/velotok-minimal:/var/www/html/wp-content/themes/velotok-minimal:ro
      - ./wp/themes/design-variants.json:/var/www/html/wp-content/themes/design-variants.json:ro
      - ./scripts:/var/www/html/scripts:ro
      - ./content:/var/www/html/content:ro
      - ./assets:/var/www/html/assets:ro

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
    working_dir: /var/www/html
    user: "0:0"
    volumes:
      - wordpress_data:/var/www/html
      - ./wp/plugins/velotok-core:/var/www/html/wp-content/plugins/velotok-core:ro
      - ./wp/themes/velotok:/var/www/html/wp-content/themes/velotok:ro
      - ./wp/themes/velotok-bold:/var/www/html/wp-content/themes/velotok-bold:ro
      - ./wp/themes/velotok-minimal:/var/www/html/wp-content/themes/velotok-minimal:ro
      - ./wp/themes/design-variants.json:/var/www/html/wp-content/themes/design-variants.json:ro
      - ./wp/cli:/opt/velotok/cli:ro
      - ./scripts:/var/www/html/scripts:ro
      - ./content:/var/www/html/content:ro
      - ./assets:/var/www/html/assets:ro
    entrypoint: ["/bin/sh", "/opt/velotok/cli/wp-entrypoint.sh"]
    command: ["bootstrap"]

volumes:
  db_data:
  wordpress_data:
