name: velotok

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-velotok-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: "1"
      # WP_DEBUG сам по себе печатает замечания PHP на страницу (WP_DEBUG_DISPLAY
      # по умолчанию true). Локальный стенд должен показывать продукт, а не
      # дамп ошибок: замечания уходят в wp-content/debug.log, на страницу — нет.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', true );
    volumes:
      - wordpress_data:/var/www/html
      - ./wp/plugins/velotok-core:/var/www/html/wp-content/plugins/velotok-core:ro
      - ./wp/themes/velotok:/var/www/html/wp-content/themes/velotok:ro
      - ./wp/cli:/opt/velotok/cli:ro
      - ./scripts:/var/www/html/scripts:ro
      - ./content:/var/www/html/content:ro
      - ./assets:/var/www/html/assets:ro

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
    working_dir: /var/www/html
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - wordpress_data:/var/www/html
      - ./wp/plugins/velotok-core:/var/www/html/wp-content/plugins/velotok-core:ro
      - ./wp/themes/velotok:/var/www/html/wp-content/themes/velotok:ro
      - ./wp/cli:/opt/velotok/cli:ro
      - ./scripts:/var/www/html/scripts:ro
      - ./content:/var/www/html/content:ro
      - ./assets:/var/www/html/assets:ro
    command:
      - |
        until wp core is-installed --allow-root >/dev/null 2>&1; do
          wp core install \
            --url="http://localhost:8080" \
            --title="Велоток" \
            --admin_user="admin" \
            --admin_password="${WP_ADMIN_PASSWORD:-velotok-admin}" \
            --admin_email="admin@example.test" \
            --skip-email \
            --allow-root >/dev/null 2>&1 && break
          sleep 3
        done
        wp plugin install woocommerce --activate --allow-root >/dev/null 2>&1 || true
        wp plugin install contact-form-7 --activate --allow-root >/dev/null 2>&1 || true
        wp plugin install flamingo --activate --allow-root >/dev/null 2>&1 || true
        wp plugin activate contact-form-7 flamingo --allow-root >/dev/null 2>&1 || true
        wp plugin activate velotok-core --allow-root >/dev/null 2>&1 || true
        wp theme activate velotok --allow-root >/dev/null 2>&1 || true
        wp language core install ru_RU --activate --allow-root >/dev/null 2>&1 || true
        wp site switch-language ru_RU --allow-root >/dev/null 2>&1 || true
        wp option update WPLANG ru_RU --allow-root >/dev/null 2>&1 || true
        wp language plugin install woocommerce ru_RU --allow-root >/dev/null 2>&1 || true
        wp language plugin install contact-form-7 ru_RU --allow-root >/dev/null 2>&1 || true
        wp language plugin install flamingo ru_RU --allow-root >/dev/null 2>&1 || true
        if wp plugin is-active contact-form-7 --allow-root >/dev/null 2>&1; then
          echo "Configuring lead forms:"
          wp eval-file /opt/velotok/cli/lead-forms.php --allow-root || true
        fi
        wp option update timezone_string 'Europe/Moscow' --allow-root >/dev/null 2>&1 || true
        wp option update date_format 'd.m.Y' --allow-root >/dev/null 2>&1 || true
        wp option update time_format 'H:i' --allow-root >/dev/null 2>&1 || true
        wp option update start_of_week 1 --allow-root >/dev/null 2>&1 || true
        if wp plugin is-active woocommerce --allow-root >/dev/null 2>&1; then
          wp option update woocommerce_currency RUB --allow-root >/dev/null 2>&1 || true
          wp option update woocommerce_currency_symbol '₽' --allow-root >/dev/null 2>&1 || true
          wp option update woocommerce_price_num_decimals 0 --allow-root >/dev/null 2>&1 || true
          wp option update woocommerce_price_decimal_sep ',' --allow-root >/dev/null 2>&1 || true
          wp option update woocommerce_price_thousand_sep ' ' --allow-root >/dev/null 2>&1 || true
          wp option update woocommerce_price_format '%2$s %1$s' --allow-root >/dev/null 2>&1 || true
          wp eval 'if ( function_exists( "velotok_localize_store" ) ) { velotok_localize_store(); }' --allow-root >/dev/null 2>&1 || true
          echo "Seeding demo catalog:"
          wp eval-file /var/www/html/scripts/seed.php --allow-root || true
          echo "Provisioning store:"
          wp eval 'if ( function_exists( "velotok_core_provision_store" ) ) { $provisioned = velotok_core_provision_store(); echo "checkout_ready=" . ( ! empty( $provisioned["checkout_ready"] ) ? "yes" : "no" ) . PHP_EOL; } else { echo "provisioning module is not loaded" . PHP_EOL; }' --allow-root || true
        fi
        echo "Running specification data contract test:"
        wp eval-file wp-content/plugins/velotok-core/tests/spec-data-contract-test.php --allow-root
        echo "Running product attributes contract test:"
        wp eval-file wp-content/plugins/velotok-core/tests/product-attributes-contract-test.php --allow-root
        echo "Running payment gateway contract test:"
        wp eval-file wp-content/plugins/velotok-core/tests/payment-gateway-contract-test.php --allow-root
        echo "Running product attributes card test:"
        php wp-content/plugins/velotok-core/tests/product-attributes-card-test.php
        echo "Running catalog render test:"
        php wp-content/themes/velotok/tests/catalog-render-test.php
        echo "Running catalog display test:"
        php wp-content/themes/velotok/tests/catalog-display-test.php
        echo "Running catalog all products test:"
        php wp-content/themes/velotok/tests/catalog-all-products-test.php
        echo "Running catalog published products test:"
        php wp-content/themes/velotok/tests/catalog-published-products-test.php
        exec tail -f /dev/null

volumes:
  db_data:
  wordpress_data:
